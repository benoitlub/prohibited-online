<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1165" viewBox="0 0 900 1165" role="img" aria-label="Feuch Institut mobile game table">
  <defs>
    <radialGradient id="feltGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#243b1b"/>
      <stop offset="45%" stop-color="#172713"/>
      <stop offset="100%" stop-color="#07100a"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#120905"/>
      <stop offset=".35" stop-color="#4b2612"/>
      <stop offset=".7" stop-color="#1b0c06"/>
      <stop offset="1" stop-color="#6b3919"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" x2="1">
      <stop offset="0" stop-color="#684218"/>
      <stop offset=".45" stop-color="#f2be55"/>
      <stop offset="1" stop-color="#6e4216"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="feltNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .16"/>
      </feComponentTransfer>
      <feBlend mode="soft-light" in2="SourceGraphic"/>
    </filter>
    <pattern id="leafPattern" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M19 6 C11 14 12 24 19 32 C26 24 27 14 19 6Z" fill="none" stroke="#3f6f31" stroke-width="1.2" opacity=".22"/>
      <path d="M19 9 L19 30" stroke="#3f6f31" stroke-width=".8" opacity=".18"/>
    </pattern>
  </defs>

  <rect width="900" height="1165" fill="#020604"/>
  <rect x="0" y="0" width="900" height="1165" fill="url(#leafPattern)" opacity=".13"/>

  <g opacity=".88">
